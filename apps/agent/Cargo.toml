[package]
name = "nomad-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NomadCraft agent: supervises the local Minecraft server and syncs the world."

[lib]
name = "nomad_agent"
path = "src/lib.rs"

[[bin]]
name = "nomad-agent"
path = "src/main.rs"

[dependencies]
nomad-proto = { path = "../../crates/nomad-proto" }
nomad-snapshot = { path = "../../crates/nomad-snapshot" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
hex.workspace = true
walkdir.workspace = true
uuid.workspace = true
shlex = "1"
sysinfo = "0.33"

[dev-dependencies]
tempfile.workspace = true
nomad-control-plane = { path = "../control-plane" }
axum = "0.8"
