[workspace]
resolver = "2"
members = [
    "crates/nomad-proto",
    "crates/nomad-snapshot",
    "apps/control-plane",
    "apps/agent",
    "apps/relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OaHaij666/nomadcraft"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
blake3 = "1"
fastcdc = "3"
zstd = "0.13"
walkdir = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
